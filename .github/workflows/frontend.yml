name: Frontend CI

on:
  push:
    paths:
      - 'frontend_app/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend_app/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  flutter:
    name: frontend_app (Flutter 3.47.5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend_app
    steps:
      - uses: actions/checkout@v7
      # Ghim đúng bản Flutter trên máy dev; đổi cả hai nơi cùng lúc.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Nền tảng đang nhắm (PLAN D7): Android, web, Windows, macOS — iOS tạm bỏ. Máy dev là Mac nên bản Windows chỉ
  # build được ở đây. Bản build trỏ backend mặc định (localhost; máy ảo Android 10.0.2.2), tải ở tab Actions để thử.
  build:
    name: build ${{ matrix.target }}
    needs: flutter
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apk
            os: ubuntu-latest
            output: frontend_app/build/app/outputs/flutter-apk/app-release.apk
          - target: web
            os: ubuntu-latest
            output: frontend_app/build/web
          - target: windows
            os: windows-latest
            output: frontend_app/build/windows/x64/runner/Release
          - target: macos
            os: macos-latest
            output: frontend_app/build/SmartFit-AI-macos.zip
    defaults:
      run:
        working-directory: frontend_app
    steps:
      - uses: actions/checkout@v7
      # AGP 9 cần JDK 17 trở lên; máy dev dùng JDK 21 đi kèm Android Studio.
      - if: matrix.target == 'apk'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release
      # .app có symlink và quyền chạy — upload-artifact làm mất cả hai, nên nén bằng ditto trước.
      - if: matrix.target == 'macos'
        run: ditto -c -k --keepParent "build/macos/Build/Products/Release/SmartFit AI.app" build/SmartFit-AI-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: smartfit-${{ matrix.target }}
          path: ${{ matrix.output }}
          retention-days: 7

  # Bản web chạy thật (PLAN 9.3): GitHub Pages, trỏ backend trên Vercel. Chỉ nhánh Thien-Source (bản demo), và chỉ khi
  # repo đã có Variables API_BASE_URL, GOOGLE_WEB_CLIENT_ID (Settings → Secrets and variables → Actions → Variables) —
  # hai giá trị này nằm công khai trong JavaScript của bản web, không phải bí mật.
  pages:
    name: deploy web (GitHub Pages)
    needs: flutter
    if: github.event_name == 'push' && github.ref == 'refs/heads/Thien-Source' && vars.API_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend_app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      # Trang nằm ở https://<owner>.github.io/<tên repo>/ nên base href là /<tên repo>/.
      - run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend_app/build/web
      - id: deploy
        uses: actions/deploy-pages@v5
