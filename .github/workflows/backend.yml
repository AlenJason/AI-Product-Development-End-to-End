name: Backend CI

on:
  push:
    paths:
      - 'backend_api/**'
      - 'ai_workspace/**'
      # test/contract-fixtures.e2e-spec.ts so fixture đã commit với response thật của backend
      - 'frontend_app/test/fixtures/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend_api/**'
      - 'ai_workspace/**'
      # test/contract-fixtures.e2e-spec.ts so fixture đã commit với response thật của backend
      - 'frontend_app/test/fixtures/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  backend:
    name: backend_api (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    defaults:
      run:
        working-directory: backend_api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend_api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:smoke

  ai_workspace:
    name: ai_workspace (type-check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai_workspace
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai_workspace/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
