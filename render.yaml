services:
  - type: web
    name: smartfit-api
    runtime: node
    rootDir: backend_api
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: mysql
      - key: DB_HOST
        value: gateway01.ap-northeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: test
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_MOCK_AUTH
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://ai-product-development-end-to-end-f.vercel.app,https://smartfit-api.vercel.app,http://localhost:3000"
